name: Release

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  GODOT_VERSION: "4.5.1"
  STS2_SIGNATURES_REPO: "RaymondBlaze/STS2-API-Signatures"
  STS2_SIGNATURES_PATH: "ci/STS2-API-Signatures"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4

      - name: Read version
        run: |
          MOD_VERSION=$(grep -oP '<ModVersion>\K[^<]+' godot/DefectOverhaul.csproj)
          STS2_VERSION=$(grep -oP '<Sts2Version>\K[^<]+' godot/DefectOverhaul.csproj)
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "STS2_VERSION=$STS2_VERSION" >> "$GITHUB_ENV"

      - name: Checkout API stubs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STS2_SIGNATURES_REPO }}
          path: ${{ env.STS2_SIGNATURES_PATH }}
          ref: v${{ env.STS2_VERSION }}
          token: ${{ secrets.STS2_SIGNATURES_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Godot
        run: |
          GODOT_DIR="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          GODOT_ARCHIVE="${GODOT_DIR}.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ARCHIVE}"
          unzip -q "$GODOT_ARCHIVE"
          GODOT_BIN="${GODOT_DIR}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$(pwd)/$GODOT_BIN" >> "$GITHUB_ENV"
        env:
          GODOT_VERSION: ${{ env.GODOT_VERSION }}

      - name: Build
        run: dotnet build godot/DefectOverhaul.csproj
          -p:Sts2DataDir=$(pwd)/${{ env.STS2_SIGNATURES_PATH }}/data
          -p:GodotExe=${{ env.GODOT_BIN }}

      - name: Extract release notes
        run: |
          awk -v ver="${{ env.MOD_VERSION }}" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MOD_VERSION }}
          name: v${{ env.MOD_VERSION }}
          body_path: release_body.md
          files: build/DefectOverhaul-${{ env.MOD_VERSION }}.zip
